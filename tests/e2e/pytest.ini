# Config for `pytest tests/e2e` only. pytest picks the nearest ini file above the
# paths it is given, so this one replaces pyproject.toml for the e2e layer.
#
# The root pyproject.toml configures the in-process layer (pytest-asyncio and the
# Home Assistant plugins). e2e.yaml installs neither: the tests are synchronous
# and talk to a container over REST/websocket (requirements.txt), so reading that
# config here warned "Unknown config option: asyncio_mode".
[pytest]
timeout_func_only = true
markers =
    needs_real_ha(reason): why this test must run in a real Home Assistant (see ../CLAUDE.md)
