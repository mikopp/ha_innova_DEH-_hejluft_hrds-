# hassfest validation.
#
# `hassfest` is Home Assistant's own manifest/translation validator. It checks
# that custom_components/innova_hrds/manifest.json is well-formed (domain,
# requirements, codeowners, iot_class, version, ...) and that the translation
# files are consistent. This is the canonical "will Home Assistant accept this
# integration?" check and runs on every pull request and on main (not twice per PR).
name: hassfest

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: hassfest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # home-assistant/actions has no release tags, so Dependabot cannot bump
      # this pin: re-pin to the current master commit by hand now and then. The
      # action only runs the ghcr.io/home-assistant/hassfest image (latest).
      - uses: home-assistant/actions/hassfest@cd6f3635a740c84d8a14f6121a90068b8ece6bf6 # master
