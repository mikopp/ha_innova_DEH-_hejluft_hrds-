# Python linting & formatting check.
#
# Runs Ruff (linter + formatter) over the whole repository on every pull
# request and on main (after a merge). Not on every push to a branch: a branch
# with an open PR is covered by the PR run, so nothing runs twice. This is the fast "is the Python clean?" gate:
#   * `ruff check`  -> static lint rules (pyflakes/pycodestyle/isort, see ruff.toml)
#   * `ruff format --check` -> fails if any file is not formatted
#   * tests/wiring_check.py -> classification, platforms, translations,
#     register docs and block plan, with Home Assistant stubbed out
#   * tests/adr_check.py -> the ADRs (.claude/rules/adr, doc/adr/proposed and
#     /superseded): format, scopes, folders, indexes, topic map, citations,
#     revival records, confirmation checks
# It does NOT import Home Assistant, so it is quick and has no HA dependency.
name: Lint

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
      - name: Install Ruff
        run: pip install -r requirements_lint.txt
      - name: Ruff lint
        run: ruff check .
      - name: Ruff format check
        run: ruff format --check .
      - name: Wiring check
        run: python3 tests/wiring_check.py
      - name: ADR check
        run: python3 tests/adr_check.py
