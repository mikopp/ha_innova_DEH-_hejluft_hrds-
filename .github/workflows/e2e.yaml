# End-to-end tests: the integration in a real Home Assistant container.
#
# Deliberately small: only what an in-process Home Assistant (tests.yaml) cannot
# show. Every test names why (ADR-0019, tests/CLAUDE.md): HA installing the integration
# itself, flows and services as HTTP/JSON, the real scheduler, the setup
# surviving real restarts, booting before the unit is up, and the real log.
# Behaviour scenarios (modes, fan, alarms, display, ...) live in tests/ha.
#
# Runs on pull requests (tests skipped without a code change, ADR-0035), on
# main after a merge, nightly (also against the HA
# beta image) and from release.yaml on the tagged commit. One container per
# session, onboarded once, driven over REST/websocket (like the
# homeassistent-config repo); simulated HRDS+ units (tests/sim) run as processes
# on the runner and speak real Modbus TCP.
#
# The image is pinned in .github/ha-versions/Dockerfile (latest release,
# bumped by Dependabot).
name: E2E (Home Assistant in Docker)

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:  # release.yaml: the tagged commit
  schedule:
    - cron: "17 3 * * *"

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  e2e:
    name: e2e (${{ matrix.channel }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        channel: [pinned, beta]
        exclude:
          - channel: ${{ github.event_name != 'schedule' && 'beta' || 'none' }}
    continue-on-error: ${{ matrix.channel == 'beta' }}
    env:
      HRDS_E2E_ARTIFACTS: ${{ github.workspace }}/e2e-artifacts
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2  # the PR merge commit and its base

      # A pull request that changes no code, test or dependency (the patterns
      # in .github/test-paths) skips the steps below; the job still reports,
      # so the required check passes (ADR-0035). Every other event runs all.
      - name: Changed code, tests or dependencies?
        id: changes
        run: |
          if [ "$GITHUB_EVENT_NAME" != "pull_request" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          # The PR merge commit's first parent is the base branch.
          git diff --name-only HEAD^1 HEAD | tee /tmp/changed.txt
          if grep -qEf .github/test-paths /tmp/changed.txt; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No code, test or dependency change: tests skipped (ADR-0035)"
          fi

      # Pull in the background while Python is set up (as the config repo does).
      - name: Pick and pull the Home Assistant image
        if: steps.changes.outputs.run == 'true'
        run: |
          if [ "${{ matrix.channel }}" = "beta" ]; then
            image=ghcr.io/home-assistant/home-assistant:beta
          else
            image=$(awk '/^FROM /{print $2}' .github/ha-versions/Dockerfile)
          fi
          echo "HRDS_E2E_IMAGE=$image" >> "$GITHUB_ENV"
          nohup sh -c "docker pull $image > /tmp/pull.log 2>&1; echo \$? > /tmp/pull.rc" &

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        if: steps.changes.outputs.run == 'true'
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: tests/e2e/requirements.txt
      - name: Install e2e requirements
        if: steps.changes.outputs.run == 'true'
        run: pip install -r tests/e2e/requirements.txt

      - name: Wait for the image
        if: steps.changes.outputs.run == 'true'
        run: |
          while [ ! -f /tmp/pull.rc ]; do sleep 2; done
          cat /tmp/pull.log | tail -3
          if [ "$(cat /tmp/pull.rc)" != "0" ]; then docker pull "$HRDS_E2E_IMAGE"; fi

      # The simulator runs on the runner, so give it the pymodbus the image's
      # Home Assistant ships (read from its modbus manifest; the image does not
      # necessarily have it installed yet).
      - name: Install the image's pymodbus
        if: steps.changes.outputs.run == 'true'
        run: |
          req=$(docker run --rm "$HRDS_E2E_IMAGE" python -c "import json, pathlib, homeassistant.components.modbus as m; print(next(r for r in json.loads(pathlib.Path(m.__file__).with_name('manifest.json').read_text())['requirements'] if r.startswith('pymodbus')))")
          echo "pymodbus requirement of $HRDS_E2E_IMAGE: $req"
          pip install "$req"

      - name: check_config
        if: steps.changes.outputs.run == 'true'
        run: |
          python -m tests.e2e.stage /tmp/ha-check
          docker run --rm -v /tmp/ha-check:/config "$HRDS_E2E_IMAGE" \
            python -m homeassistant --config /config --script check_config \
            2>&1 | tee /tmp/check_config.txt
          if grep -Eiq "invalid config|Setup of package.*failed|ERROR" /tmp/check_config.txt; then
            echo "::error::check_config reported problems"; exit 1
          fi

      - name: Run e2e tests
        if: steps.changes.outputs.run == 'true'
        run: |
          set -o pipefail
          pytest tests/e2e -v -p no:homeassistant --timeout=300 --timeout-method=thread \
            2>&1 | tee /tmp/pytest_e2e.txt

      - name: Job summary
        if: always() && steps.changes.outputs.run == 'true'
        run: |
          {
            echo "## E2E against \`$HRDS_E2E_IMAGE\`"
            echo '```'
            grep -E "PASSED|FAILED|ERROR|passed|failed" /tmp/pytest_e2e.txt | tail -80 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload logs
        if: always() && steps.changes.outputs.run == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-logs-${{ matrix.channel }}
          path: |
            e2e-artifacts/
            /tmp/pytest_e2e.txt
            /tmp/check_config.txt
          if-no-files-found: ignore
